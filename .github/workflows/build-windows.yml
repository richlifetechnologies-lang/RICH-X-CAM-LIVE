name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "RICH X CAM LIVE v1.2.2 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.2 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.2.2.exe`

            ### 🛠️ Critical Fix: Realtime Call Start & Resilient fal.ai Gateway
            - **Resolved "Call failed: the built-in API server is not reachable / Failed to execute fetch on Window"**:
              - Added native Electron IPC gateway (`fal-token`, `fal-upload-image`, `fal-status`) running directly inside the desktop main process.
              - Eliminates reliance on loopback HTTP port binding, antivirus blocking of child Node processes, CORS issues, and `file://` protocol relative URL resolution failures.
              - Multi-tier `FalGateway` with automatic fail-safe fallback: Electron IPC -> Local server proxy -> Direct official fal.ai CORS client gateway.
              - Server loopback bound to `127.0.0.1` instead of `0.0.0.0` to eliminate Windows Defender Firewall prompts.
              - Resilient preflight check that validates credential availability without throwing raw fetch parse exceptions.

            ### 🎥 Native Virtual Camera ("RICHX CAM") & Audio ("RICHX MIC"):
            - DirectShow Virtual Camera Filter Bundled in `drivers/virtual-camera/`.
            - Registers `RICHX CAM` directly as a native video capture device in Windows for WhatsApp Desktop, Zoom, Microsoft Teams, Discord, Google Meet, and Skype.
            - Offline `VBCABLE_Driver_Pack43` setup in `drivers/virtual-audio/` with silent registration.

            ### ⚡ Included Features:
            - Official fal.ai LUCY 2.5 Realtime WebRTC WebSocket signaling relay.
            - Dual-field inputs for Key ID and Key Secret with Show/Hide toggle and auto-split paste detection.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
