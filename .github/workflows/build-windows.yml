name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "RICH X CAM LIVE v1.1.0 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.1.0 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.1.0.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.

            ### ✨ What's New in v1.1.0:
            - **Webcam Privacy Fixed**: the camera now stays completely off until you start a call (powered off in standby, no more auto-on at launch).
            - **Genuine fal.ai LUCY 2.5 Output**: the Video Output panel now shows only the real AI-generated stream. The raw local camera fallback has been removed — if the fal.ai engine can't connect, you get a clear error instead of a fake feed.
            - **Bundled API Server**: the Express server that proxies fal.ai WebRTC/token/upload routes now ships inside the installed app and starts automatically with it (previously all `/api/fal/*` calls failed in the desktop build).
            - **Demo Key Removed**: the pre-seeded `RICHX-DEMO-60MIN-LIVE` key is gone. The studio is locked until a valid product key is activated, and tabs respect the license mode (video+audio / audio-only / video-only).
            - **Honest Virtual Devices**: the installer now creates a real "RICHX MIC" audio endpoint via the official VB-CABLE driver and guides you through a real virtual camera driver (e.g. OBS Virtual Camera) — no phantom registry devices.
              - Run `drivers\install-richx-virtual-devices.bat` as Administrator after installing.
            - **Version Bump**: 1.0.3 -> 1.1.0.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
