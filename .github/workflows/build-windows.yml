name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.3
          name: "RICH X CAM LIVE v1.2.3 — Windows Setup & Portable (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.3 for Windows 10 & 11

            ### 🚀 Direct Windows Downloads:
            - **Portable Standalone (.exe)** *(No installation required, click & run)*:
              **`RICH-X-CAM-LIVE-Portable-1.2.3.exe`**
            - **Standard Windows Setup Wizard (.exe)**:
              **`RICH-X-CAM-LIVE-Setup-1.2.3.exe`**

            ### 🛠️ Key Fixes in v1.2.3:
            1. **NSIS Installer Auto-Process Termination**:
               - Added custom NSIS installer hook (`build/installer.nsh`) that automatically force-closes lingering background process trees so the installer never gets stuck with the *"cannot be closed"* prompt.
               - Added portable standalone target (`RICH-X-CAM-LIVE-Portable-1.2.3.exe`) that runs directly without installation.
            2. **Clean Process Tree Termination on Windows**:
               - Updated desktop backend child process cleanup using Windows native taskkill tree termination, preventing orphaned background processes.
            3. **Native Desktop Electron IPC Gateway (v1.2.2)**:
               - Eliminates localhost `file://` fetch parsing errors and Windows firewall port blocking.
            4. **Virtual Camera & Virtual Microphone Drivers**:
               - Bundled native DirectShow Virtual Camera filter (`RICHX CAM`) and Virtual Audio cable (`RICHX MIC`) with registration scripts.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
