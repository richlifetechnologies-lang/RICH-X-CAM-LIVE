name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "RICH X CAM LIVE v1.2.0 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.0 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.2.0.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.

            ### ⚡ What is New in v1.2.0:
            - **Official fal.ai LUCY 2.5 Realtime WebRTC Relay**:
              - Replaced non-functional HTTP POST signaling with the official fal.ai WebSocket signaling relay with MsgPack binary framing.
              - Automatic WebRTC peer connection negotiation, ICE servers provisioning, SDP offer/answer exchange, and Trickle ICE candidate relay.
              - Stable 30 FPS neural video transformation with real-time prompt and character persona updates during active calls.
            - **Mistake-Proof fal.ai Key Pair Inputs**:
              - Distinct, high-contrast labels for **Key ID (Public Identifier / UUID)** and **Key Secret (Private Secret)** across all dashboard tabs and settings dialogs.
              - **Show/Verify Keys toggle button** to visually confirm values without password asterisks.
              - **Smart Auto-Split**: Pasting a combined `key-id:key-secret` or `Key key-id:key-secret` automatically populates both fields correctly.
              - Live validation badges: Instant visual confirmation when both required parts are set, or clear warning if one part is missing.
            - **Dual-Field Video Engine Credentials in Studio**:
              - Engine Credentials modal in the Studio now includes the full two-part Key ID + Key Secret pair input.

            ### 🎙️ Virtual Devices:
            - Run `drivers\install-richx-virtual-devices.bat` as Administrator after installing to set up the "RICHX MIC" audio endpoint (official VB-CABLE driver, installed automatically).
            - The native "RICHX CAM" virtual camera driver (no third-party software) ships in an upcoming update.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
