name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "RICH X CAM LIVE v1.1.2 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.1.2 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.1.2.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.

            ### 🔥 Hotfix: "Call failed: Failed to execute 'fetch'" is fixed
            v1.1.1 could silently load without its built-in API server (antivirus slow-scan on first launch, or a leftover instance holding the port). The app looked normal, but every fal.ai call then failed with `Failed to execute 'fetch' on 'Window'`. v1.1.2 fixes this for good:
            - **Dynamic API port**: the bundled server now binds a free loopback port at launch, so a previous/zombie instance can never block it.
            - **Single-instance lock**: opening the app twice focuses the existing window instead of spawning a conflicting second copy.
            - **Longer health wait + auto-restart**: up to 50 seconds for antivirus scanning, with one automatic server restart in between.
            - **Visible error dialog**: if the server truly cannot start, you now see a clear dialog telling you what to do (restart / allow in antivirus) instead of a dead app.
            - **Clear in-app message**: if you press Start Video Call while the API server is unreachable, the status bar now says exactly that instead of a cryptic fetch error.

            ### ✨ Also in this build (from v1.1.1):
            - **fal.ai Key ID + Key Secret Fields**: every fal.ai video key input in the Admin Dashboard (Ctrl+Shift+A) is a two-field form — Key ID and Key Secret — combined automatically into the `key-id:key-secret` format fal.ai requires.
            - **Honest Call Errors**: the real fal.ai error stays on screen when a call fails.
            - **Camera Preview Toggle**: "Turn Camera On/Off" in the Live Webcam Input panel for pre-call testing.

            ### 🎙️ Virtual Devices:
            - Run `drivers\install-richx-virtual-devices.bat` as Administrator after installing to set up the "RICHX MIC" audio endpoint (official VB-CABLE driver, installed automatically).
            - The native "RICHX CAM" virtual camera driver (no third-party software) ships in an upcoming update.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
