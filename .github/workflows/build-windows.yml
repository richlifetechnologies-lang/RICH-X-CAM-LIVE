name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "RICH X CAM LIVE v1.1.1 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.1.1 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.1.1.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.

            ### ✨ What's New in v1.1.1:
            - **fal.ai Key ID + Key Secret Fields**: every fal.ai video key input in the Admin Dashboard (Ctrl+Shift+A) is now a two-field form — Key ID and Key Secret — combined automatically into the `key-id:key-secret` format fal.ai requires. This fixes the "Establishing WebRTC" then immediate disconnect: a wrong or incomplete key no longer silently kills the call.
              - Master key: Admin Dashboard → Engine tab.
              - Per-license keys: create/edit license → "paste video API key (fal.ai)".
              - Key Vault: Add New Key → type VIDEO.
              - Find both values at https://fal.ai/dashboard/keys
            - **Honest Call Errors**: when a call fails, the real error message now stays on screen instead of being overwritten by "Service stopped" — you see exactly why fal.ai refused (e.g. invalid key).
            - **Camera Preview Toggle**: the Live Webcam Input panel now has a "Turn Camera On" button in standby so you can test your camera before a call, and "Turn Off" during manual preview. During calls the camera still turns on/off automatically.
            - **Version Bump**: 1.1.0 -> 1.1.1.

            ### 🎙️ Virtual Devices:
            - Run `drivers\install-richx-virtual-devices.bat` as Administrator after installing to set up the "RICHX MIC" audio endpoint (official VB-CABLE driver, installed automatically).
            - The native "RICHX CAM" virtual camera driver (no third-party software) ships in an upcoming update.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
