name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "RICH X CAM LIVE v1.2.2 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.2 for Windows 10 & 11

            ### Critical Fix: Realtime Call Start & Resilient fal.ai Gateway
            - **Resolved "Call failed: the built-in API server is not reachable / Failed to execute fetch on Window"**:
              - Added native Electron IPC gateway (`fal-token`, `fal-upload-image`, `fal-status`) running directly in the desktop process. Bypasses localhost port binding, CORS restrictions, `file://` protocol URL limitations, and antivirus/firewall blocks.
              - Added multi-tier FalGateway with automatic fallback: Electron IPC -> Local API proxy -> Direct official fal.ai CORS client gateway.
              - Bound local server to `127.0.0.1` loopback instead of `0.0.0.0`, preventing Windows Defender Firewall alerts.
              - Preflight readiness check now validates credential configuration safely without throwing unhandled fetch exceptions.

            ### Virtual Camera & Audio Drivers
            - Bundles direct native **RICHX CAM** DirectShow virtual camera and **RICHX MIC** bridge drivers.
            - Setup script automatically registers devices into Windows Registry so they appear in Zoom, WhatsApp, Teams, Google Meet, Discord, etc.

            ### Downloads:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.2.2.exe`
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.2 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.2.2.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.

            ### 🎥 Native Virtual Camera ("RICHX CAM") Now Fully Bundled:
            - **DirectShow Virtual Camera Filter Bundled**:
              - Bundled 64-bit and 32-bit `richxcam64.dll` & `UnityCaptureFilter64.dll` in `drivers/virtual-camera/`.
              - Automatically registers `RICHX CAM` as a native video capture device directly in Windows.
              - **No third-party camera software required** — "RICHX CAM" appears directly in WhatsApp Desktop, Zoom, Microsoft Teams, Discord, Google Meet, and Skype.
            - **Offline Virtual Audio ("RICHX MIC") Bundled**:
              - Bundled offline `VBCABLE_Driver_Pack43` setup in `drivers/virtual-audio/`.
              - Installs silently offline without requiring external internet downloads or prompts.
            - **Auto-Registration & Driver Status Check**:
              - `Install-RichXVirtualDevices.ps1` and `install-richx-virtual-devices.bat` now silently install and register both **RICHX CAM** and **RICHX MIC**.
              - DirectShow registry query added to Electron driver detection so the app immediately shows "Camera: Installed (RICHX CAM)" and "Microphone: Installed (RICHX MIC)".

            ### ⚡ Included from v1.2.0:
            - Official fal.ai LUCY 2.5 Realtime WebRTC WebSocket signaling relay.
            - Fail-safe dual-field inputs for Key ID and Key Secret with Show/Hide toggle and auto-split paste detection.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
