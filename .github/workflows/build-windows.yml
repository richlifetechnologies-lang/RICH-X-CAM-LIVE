name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps
          npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc --no-save

      - name: Build Web Application (Vite)
        shell: pwsh
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.4
          name: "RICH X CAM LIVE v1.2.4 — Windows Setup & Portable (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.2.4 for Windows 10 & 11

            ### 🚀 Direct Windows Downloads:
            - **Portable Standalone (.exe)** *(No installation required, click & run)*:
              **`RICH-X-CAM-LIVE-Portable-1.2.4.exe`**
            - **Standard Windows Setup Wizard (.exe)**:
              **`RICH-X-CAM-LIVE-Setup-1.2.4.exe`**

            ### 🎥 v1.2.4 — LUCY 2.5 signaling made exact (live-verified against fal.ai)
            The realtime stream was proven end-to-end against fal.ai with a real key (relay answer received, remote audio + video tracks attached, peer connection `connected`, 1280×720 AI frames playing). Three signaling details in the previous build did not match the relay's real protocol and are now corrected:
            1. **ICE candidates use the relay's real message type**: candidates are now sent as `{type: "candidate"}` with the fully serialized candidate (including `usernameFragment`). The previous `"icecandidate"` type was silently ignored by the relay, so fal.ai never learned our network addresses.
            2. **Negotiation waits for the relay's actual ICE server list**: the relay first sends `{type: "ready"}` with empty ICE servers, then a separate `{type: "iceServers"}` frame. v1.2.3 started negotiating on the empty `ready` frame and hard-coded public STUN — which would break any session where fal.ai supplies TURN servers. The real list is now used.
            3. **Prompt and persona image ride on the offer frame**: LUCY 2.5 reads `prompt` / `reference_image_url` from the offer message itself. They were previously sent as a separate message that is not part of the relay schema, so your prompt and target identity could be ignored.

            ### 📦 Everything from v1.2.3 is included:
            - NSIS installer auto-terminates lingering processes (no more *"cannot be closed"* prompt) + portable standalone target.
            - Clean Windows process-tree termination for the bundled API server.
            - Native Electron IPC gateway (no localhost `file://` fetch errors, no firewall port dependency).
            - Bundled native DirectShow virtual camera (`RICHX CAM`) and virtual audio cable (`RICHX MIC`) with registration scripts.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
