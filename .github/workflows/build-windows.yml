name: Build Windows Application (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Build Windows .exe Executables (Installer & Portable)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RICH-X-CAM-LIVE-Windows-Build
          path: |
            release/*.exe
            release/*.blockmap

      - name: Create GitHub Release with Windows .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RICH X CAM LIVE v1.0.0 — Windows Setup Installer (.exe)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # RICH X CAM LIVE v1.0.0 for Windows 10 & 11

            ### 🚀 Direct Windows Download:
            - **Standard Windows Setup Wizard**: `RICH-X-CAM-LIVE-Setup-1.0.0.exe`
              - Full standard installation wizard with custom destination drive/folder selection.
              - Desktop logo icon and Start Menu shortcuts automatically installed.
              - Includes **RICHX CAM** DirectShow Virtual Camera and **RICHX MIC** virtual audio driver for WhatsApp, Zoom, Teams, Discord, and Telegram.

            ### ✨ Features:
            - **Pristine Clean Video Stage**: Zero overlay clutter or writing on active video calls.
            - **Target Avatar Reference Engine**: Instant avatar photo upload, curated presets, and live webcam snapshot.
            - **RICHX Virtual Devices**: Seamless integration with WhatsApp Desktop, Telegram, Discord, and Zoom.
            - **Universal STOP Buttons** across all three studio tabs.
            - **16:9 PC Webcam (Landscape)** and **9:16 Mobile Phone Portrait** orientation modes.
            - Real-time **Lip-Sync** auto-calibration for natural microphones and cloned voices.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
